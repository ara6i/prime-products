server {
    listen 80;
    listen [::]:80;
    server_name merchants.primestyleai.com;

    root /var/www/merchants.primestyleai.com/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = / {
        error_page 418 = /__merchant_index_rsc;
        if ($http_rsc = "1") { return 418; }
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch" always;
    }

    location = /privacy-policy {
        error_page 418 = /__merchant_privacy_rsc;
        if ($http_rsc = "1") { return 418; }
        try_files /privacy-policy/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch" always;
    }

    location = /privacy-policy/ {
        return 301 /privacy-policy;
    }

    location = /terms {
        error_page 418 = /__merchant_terms_rsc;
        if ($http_rsc = "1") { return 418; }
        try_files /terms/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Vary "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch" always;
    }

    location = /terms/ {
        return 301 /terms;
    }

    location = /__merchant_index_rsc {
        internal;
        default_type text/x-component;
        try_files /index.rsc =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /__merchant_privacy_rsc {
        internal;
        default_type text/x-component;
        try_files /privacy-policy.rsc =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /__merchant_terms_rsc {
        internal;
        default_type text/x-component;
        try_files /terms.rsc =404;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/api/contact/(pilot-request|email-otp/request|email-otp/verify)$ {
        client_max_body_size 64k;
        limit_except POST OPTIONS { deny all; }

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /media/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /icon.svg {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location = /merchants/icon.png {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /favicon.ico {
        default_type image/png;
        try_files /merchants/icon.png =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location = /merchants {
        return 301 /;
    }

    location = /merchants/ {
        return 301 /;
    }

    location / {
        return 302 /;
    }
}
