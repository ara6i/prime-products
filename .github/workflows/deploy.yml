name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to DigitalOcean Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            APP_DIR="/var/www/prime-products"
            REPO_URL="git@github.com:${{ github.repository }}.git"
            BRANCH="${{ github.ref_name }}"

            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning fresh..."
              mkdir -p /var/www
              cd /var/www
              git clone "$REPO_URL" prime-products
              cd prime-products
              git checkout "$BRANCH"
            else
              echo "Resetting to origin/$BRANCH..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard "origin/$BRANCH"
            fi

            echo "Installing dependencies..."
            npm install

            echo "Building project..."
            npm run build

            echo "Publishing creator static site..."
            CREATOR_RELEASE_LABEL="$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}" \
              bash scripts/deploy-creator-static.sh

            echo "Restarting PM2..."
            if pm2 describe prime-products > /dev/null 2>&1; then
              pm2 restart prime-products --update-env
            else
              PORT=3001 pm2 start npm --name "prime-products" -- start
            fi
            pm2 save

            echo "Deployment complete!"
