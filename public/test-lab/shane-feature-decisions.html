<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MyAIFitting feature decisions for Shane</title>
  <style>
    :root { color-scheme: light; --ink:#201d2a; --muted:#6d6877; --line:#ddd9e5; --blue:#2154ef; --soft:#f5f6fb; --gold:#fff0a8; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eeeff4; color:var(--ink); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(960px,calc(100% - 28px)); margin:28px auto 72px; }
    header,.card,.summary { background:white; border:1px solid var(--line); border-radius:22px; box-shadow:0 12px 36px rgba(34,31,45,.06); }
    header { padding:28px; background:linear-gradient(135deg,#fff 0%,#f2f5ff 100%); }
    h1 { margin:0 0 8px; font-size:clamp(26px,5vw,42px); line-height:1.05; letter-spacing:-.04em; }
    h2 { margin:30px 0 12px; font-size:20px; }
    p { margin:0; } .muted { color:var(--muted); }
    .badge { display:inline-flex; margin-bottom:14px; border-radius:999px; background:var(--gold); padding:6px 10px; font-size:12px; font-weight:750; }
    .grid { display:grid; gap:14px; }
    .card { padding:20px; }
    .card h3 { margin:0 0 8px; font-size:17px; }
    .default { margin:12px 0; padding:12px 14px; border-left:4px solid var(--blue); border-radius:10px; background:#f3f6ff; }
    .choices { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; }
    label { display:flex; gap:7px; align-items:center; font-weight:650; }
    textarea { width:100%; min-height:72px; resize:vertical; border:1px solid var(--line); border-radius:12px; padding:11px; font:inherit; }
    textarea:focus,input:focus { outline:3px solid rgba(33,84,239,.2); border-color:var(--blue); }
    .actions { position:sticky; bottom:12px; display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; padding:14px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.94); backdrop-filter:blur(12px); }
    button { border:0; border-radius:999px; padding:11px 18px; font:inherit; font-weight:750; cursor:pointer; }
    button.primary { background:var(--blue); color:white; } button.secondary { background:var(--soft); color:var(--ink); }
    .summary { margin-top:18px; padding:20px; white-space:pre-wrap; }
    .status { min-height:24px; margin-left:auto; align-self:center; color:var(--muted); font-size:13px; }
    @media print { body{background:white}.actions{display:none}main{width:100%;margin:0}.card,header,.summary{box-shadow:none;break-inside:avoid} }
  </style>
</head>
<body>
<main>
  <header>
    <span class="badge">Decision review · proposed defaults</span>
    <h1>MyAIFitting purchase benefits, wedding styling, and sharing</h1>
    <p class="muted">Shane: please approve each proposed decision or choose “Change” and add the replacement. Answers stay in this browser and can be copied or printed.</p>
  </header>
  <div id="questions" class="grid" aria-label="Feature decision questions"></div>
  <div class="actions">
    <button class="primary" id="copy" type="button">Copy response summary</button>
    <button class="secondary" id="print" type="button">Print / Save PDF</button>
    <button class="secondary" id="reset" type="button">Reset answers</button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
  </div>
  <section class="summary" id="summary" aria-labelledby="summary-title"><h2 id="summary-title">Response summary</h2><span class="muted">No answers saved yet.</span></section>
</main>
<script>
  const questions = [
    ["Token price", "Should each completed classic Try On or AI Stylist visual outfit cost exactly 10 tokens?", "Yes. Classic Try On is 10 regardless of garment count; AI Stylist charges 10 for each outfit actually sent to visual try-on. Catalog recommendations are free."],
    ["Purchase credit", "Should buying any attributed item in its recommended size return the complete generation charge?", "Yes. Credit 10 tokens once per qualifying generation, not once per product."],
    ["Credit timing and returns", "Should the credit appear when the order is paid and reverse only when no qualifying item from that generation remains?", "Yes. Paid orders credit immediately. Cancellation or return of the last qualifying retained item appends a 10-token reversal."],
    ["Reversal shortfall", "What if fewer than 10 tokens remain when a reversal is required?", "Clamp the balance at zero and record the unrecovered shortfall for audit. Do not create token debt or seize future credits."],
    ["Free standard shipping", "Should free shipping require every sizing-eligible order line to use its recommended size?", "Yes. At least one sizing-eligible item must exist; every eligible line must match. Non-sizing items are neutral."],
    ["Attribution window", "How long after generation may an explicitly attributed purchase qualify?", "30 days from successful generation to checkout."],
    ["Expedited delivery", "How should expedited shipping work for a qualifying order?", "Credit the standard-shipping amount and charge the customer only the expedited difference."],
    ["Public share", "What should friends see without signing in?", "A revocable public link showing the tried-on outfit on the disc plus clickable, sanitized product details. Sign-in is suggested, never required."],
    ["Stars and notes", "Who may rate, and who may read written notes?", "Owners and anonymous friends may give 1–5 stars and an optional short note. Aggregates are public; raw notes are private to the owner/moderation."],
    ["Wedding launch", "What CJ-only inventory must be guaranteed for the first wedding release?", "Ten unique bride looks and ten unique groom/tuxedo looks. Bridesmaid, groomsman, and guest roles use the same palette/board workflow without an initial ten-look guarantee."],
  ];
  const storageKey = "myaifitting-shane-decisions-v1";
  let saved = {}; try { saved = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch {}
  const root = document.getElementById("questions");
  root.innerHTML = questions.map((q,i)=>`<section class="card"><h3>${i+1}. ${q[0]}</h3><p>${q[1]}</p><div class="default"><strong>Arash’s proposed default:</strong><br>${q[2]}</div><div class="choices"><label><input type="radio" name="q${i}" value="approved"> Approve</label><label><input type="radio" name="q${i}" value="change"> Change</label></div><label for="note${i}">Replacement or note</label><textarea id="note${i}" placeholder="Write a replacement decision or context…"></textarea></section>`).join("");
  function render() {
    const lines = ["MyAIFitting decisions — Shane review", ""];
    questions.forEach((q,i)=>{ const answer=saved[i]||{}; lines.push(`${i+1}. ${q[0]}: ${answer.choice || "unanswered"}${answer.note ? ` — ${answer.note}` : ""}`); });
    document.getElementById("summary").innerHTML = `<h2 id="summary-title">Response summary</h2>${lines.join("\n")}`;
    localStorage.setItem(storageKey, JSON.stringify(saved));
  }
  questions.forEach((_,i)=>{
    const answer=saved[i]||{};
    const radio=document.querySelector(`input[name=q${i}][value=${answer.choice}]`); if(radio) radio.checked=true;
    document.getElementById(`note${i}`).value=answer.note||"";
    document.querySelectorAll(`input[name=q${i}]`).forEach(el=>el.addEventListener("change",e=>{saved[i]={...(saved[i]||{}),choice:e.target.value};render();}));
    document.getElementById(`note${i}`).addEventListener("input",e=>{saved[i]={...(saved[i]||{}),note:e.target.value};render();});
  });
  document.getElementById("copy").addEventListener("click",async()=>{ await navigator.clipboard.writeText(document.getElementById("summary").innerText); document.getElementById("status").textContent="Summary copied."; });
  document.getElementById("print").addEventListener("click",()=>window.print());
  document.getElementById("reset").addEventListener("click",()=>{ if(!confirm("Clear Shane’s saved answers in this browser?"))return; saved={}; localStorage.removeItem(storageKey); location.reload(); });
  render();
</script>
</body>
</html>
